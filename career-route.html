<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>특성화고 진로 노선도</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#EEF2F5; --paper:#FFFFFF; --ink:#18232E; --ink2:#55636F; --rule:#D5DDE3;
  --go:#2546C7; --go-ink:#FFFFFF; --soft:#E3E9F7;
  --l1:#0E8F67; --l2:#E2711D; --l3:#7A4FD6; --warn:#B4361F;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121820; --paper:#1B232D; --ink:#E8EDF2; --ink2:#9DAAB6; --rule:#2E3A46;
    --go:#6E8BFF; --go-ink:#0D1320; --soft:#253152;
    --l1:#3CC79A; --l2:#F2954D; --l3:#A98BF0; --warn:#F07B63; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121820; --paper:#1B232D; --ink:#E8EDF2; --ink2:#9DAAB6; --rule:#2E3A46;
  --go:#6E8BFF; --go-ink:#0D1320; --soft:#253152;
  --l1:#3CC79A; --l2:#F2954D; --l3:#A98BF0; --warn:#F07B63; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--go)}
:focus-visible{outline:3px solid var(--go);outline-offset:2px;border-radius:6px}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* route progress: a real sequence of sections */
.route{display:flex;align-items:center;gap:0;margin:4px 0 22px}
.route .st{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;min-width:0}
.route .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--rule);background:var(--paper)}
.route .lbl{font-size:11px;color:var(--ink2);margin-top:4px;white-space:nowrap}
.route .seg{flex:1 1 auto;height:4px;background:var(--rule);margin:0 2px;transform:translateY(-9px)}
.route .done .dot{background:var(--go);border-color:var(--go)}
.route .seg.done{background:var(--go)}
.route .now .dot{border-color:var(--go);box-shadow:0 0 0 4px var(--soft)}
.route .now .lbl{color:var(--ink);font-weight:700}

.panel{background:var(--paper);border-radius:var(--r);padding:28px 24px;border:1px solid var(--rule)}
h1{font-size:30px;line-height:1.25;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:22px;line-height:1.35;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 12px}
.muted{color:var(--ink2)}
.small{font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;background:var(--go);color:var(--go-ink);font-weight:700;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* hero */
.hero-line{height:8px;border-radius:4px;margin:0 0 22px;background:linear-gradient(90deg,var(--l1) 0 33%,var(--l2) 33% 66%,var(--l3) 66% 100%)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 22px}
.facts div{border-top:3px solid var(--rule);padding-top:8px}
.facts b{display:block;font-size:22px}
.facts span{font-size:13px;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 18px}
.field input{font:inherit;padding:12px 14px;border-radius:10px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink)}

/* question */
.qmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);margin-bottom:10px}
.qtext{font-size:21px;line-height:1.45;font-weight:700;margin:0 0 22px;min-height:3em;letter-spacing:-.01em}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.likert button{border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px}
.likert .n{font-size:20px;font-weight:800}
.likert .t{font-size:12px;color:var(--ink2);line-height:1.25;text-align:center}
.choices{display:flex;flex-direction:column;gap:10px}
.choices button{text-align:left;border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:52px}
.sel{border-color:var(--go)!important;background:var(--soft)!important}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair button{border:1.5px solid var(--rule);background:var(--paper);border-radius:14px;padding:22px 14px;cursor:pointer;font-weight:700;font-size:17px;min-height:110px}
.vs{text-align:center;font-size:13px;color:var(--ink2);margin:10px 0 0}
.nav{display:flex;justify-content:space-between;margin-top:22px}
.linkbtn{background:none;border:0;color:var(--ink2);cursor:pointer;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}

/* interest chips */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin:14px 0}
.chip{position:relative;border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:12px 10px;cursor:pointer;text-align:left;font-size:15px;min-height:64px}
.chip .em{display:block;font-size:22px;line-height:1}
.chip .rk{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--go);color:var(--go-ink);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* checks */
.checks{display:flex;flex-direction:column;gap:10px;margin:10px 0 18px}
.checks label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--go)}

/* gauge */
.gauge{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,#9AA9B6 0 35%,#C9D3DB 35% 65%,var(--go) 65% 100%);margin:30px 0 46px}
.gauge .mk{position:absolute;top:-9px;width:4px;height:32px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.gauge .mk b{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:15px;white-space:nowrap}
.gauge .ax{position:absolute;top:20px;font-size:12px;color:var(--ink2);transform:translateX(-50%);white-space:nowrap}
.verdict{font-size:26px;font-weight:800;margin:4px 0 8px;letter-spacing:-.02em}
.note{border-left:4px solid var(--go);background:var(--soft);padding:12px 14px;border-radius:0 10px 10px 0;margin:14px 0;font-size:15px}
.note.warn{border-color:var(--warn);background:transparent;border:1.5px solid var(--warn);border-left-width:4px}

/* result lines (the memorable element) */
.lines{display:flex;flex-direction:column;gap:18px;margin-top:18px}
.line{background:var(--paper);border-radius:var(--r);border:1px solid var(--rule);overflow:hidden}
.line-head{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--rule)}
.badge{flex:0 0 auto;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
.line-head h3{font-size:20px;margin:0}
.score{margin-left:auto;text-align:right;font-size:13px;color:var(--ink2);white-space:nowrap;flex:0 0 auto}
.score b{display:block;font-size:22px;color:var(--ink)}
.why{padding:12px 18px 4px;margin:0;list-style:none}
.why li{position:relative;padding-left:18px;margin:0 0 6px;font-size:15px}
.why li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--lc)}
.meta{padding:0 18px 10px;font-size:14px;color:var(--ink2)}
.career{margin:4px 18px 12px;padding:12px 14px;border-radius:12px;background:var(--bg)}
.career h4{margin:0 0 8px;font-size:15px}
.career dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:start}
.career dt{font-size:13px;font-weight:700;color:var(--ink2);padding-top:3px;white-space:nowrap}
.career dd{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.career .tag{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule)}
.career .tag.now{border-color:var(--lc);border-width:1.5px}
.career .plain{font-size:14px;padding-top:2px}
.stations{position:relative;margin:6px 18px 16px 18px;padding-left:30px}
.stations::before{content:"";position:absolute;left:10px;top:12px;bottom:12px;width:6px;border-radius:3px;background:var(--lc)}
.sta{position:relative;padding:10px 0}
.sta::before{content:"";position:absolute;left:-26px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:4px solid var(--lc)}
.sta .nm{font-weight:800}
.sta .dp{font-weight:600}
.sta .inf{font-size:13px;color:var(--ink2)}
.more{margin:0 18px 16px}
.empty{padding:6px 18px 16px;font-size:14px;color:var(--ink2)}
.others{margin-top:22px}
.others table{width:100%;border-collapse:collapse;font-size:14px}
.others td{padding:7px 4px;border-bottom:1px solid var(--rule)}
.others td:last-child{text-align:right;font-variant-numeric:tabular-nums}

dialog{border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);color:var(--ink);max-width:420px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.35)}
.grid2{display:grid;grid-template-columns:1fr 110px;gap:10px 12px;align-items:center;margin:14px 0}
.grid2 input{font:inherit;padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
footer{margin-top:28px;font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

@media (max-width:480px){
  h1{font-size:26px}
  .qtext{font-size:19px}
  .likert{gap:5px}
  .likert .t{font-size:11px}
  .panel{padding:22px 18px}
  .route .lbl{display:none}
  .route .now .lbl{display:block;position:absolute;margin-top:22px}
  .route .st{position:relative}
  .route{margin-bottom:34px}
}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:f .25s ease-out}
  @keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media print{
  body{background:#fff;color:#000}
  .noprint,.route,footer{display:none!important}
  .line,.panel{break-inside:avoid;border-color:#bbb}
  .wrap{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="route" class="route noprint" aria-label="진행 단계"></div>
  <main id="app" aria-live="polite"></main>
  <footer class="noprint">
    <span id="ver"></span>
    <button class="linkbtn" id="openSet">교사용 설정</button>
  </footer>
</div>

<dialog id="setDlg">
  <h2>교사용 설정</h2>
  <p class="small muted">이 화면에서만 적용되고 저장되지 않습니다.</p>
  <div class="grid2">
    <label for="sW">관심분야 가중치</label><input id="sW" type="number" step="0.05" min="0" max="0.6">
    <label for="sHi">특성화고 권장 기준 (이상)</label><input id="sHi" type="number" step="1" min="0" max="100">
    <label for="sLo">일반고 권장 기준 (미만)</label><input id="sLo" type="number" step="1" min="0" max="100">
    <label for="sLow">저점 경고 기준</label><input id="sLow" type="number" step="1" min="0" max="100">
  </div>
  <div class="row between"><button class="btn ghost" id="setCancel">닫기</button><button class="btn" id="setSave">적용</button></div>
</dialog>

function hav(a,b){ const R=6371,t=x=>x*Math.PI/180; const dl=t(b[0]-a[0]), dn=t(b[1]-a[1]); const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function schoolPos(s){ if (s.lat!=null && s.lng!=null) return {p:[s.lat,s.lng],approx:false}; if (GU[s.gu]) return {p:GU[s.gu],approx:true}; return null; }
function distOf(s){ if(!st.home) return null; const sp=schoolPos(s); if(!sp) return null; const km=hav([st.home.lat,st.home.lng],sp.p); return {km, approx: sp.approx || st.home.src==="gu", sameGu: st.home.src==="gu" && sp.approx && st.home.label===s.gu}; }

function score1(){
  let sum=0,max=0;
  S1.forEach(q=>{
    if (!q.dir) return; max += q.w*2;
    const a = st.a1[q.id]; if (a==null) return;
    if (q.type==="choice"){ const o=q.opts.find(x=>x[0]===a); sum += (o?o[2]:0)*q.dir*q.w; }
    else sum += (a-3)*q.dir*q.w;
  });
  const idx = Math.round((sum+max)/(2*max)*100);
  let v = idx>=CFG.hi?"특성화고 권장":(idx<CFG.lo?"일반고 권장":"탐색 필요");
  const override = st.a1["S1-05"]==="D" && (st.a1["S1-03"]??3)<=2;
  if (override) v="탐색 필요";
  const inc=[];
  if (st.a1["S1-01"]!=null && st.a1["S1-10"]!=null && Math.abs(st.a1["S1-01"]-(6-st.a1["S1-10"]))>=3) inc.push(0);
  if (st.a1["S1-03"]!=null && st.a1["S1-15"]!=null && Math.abs(st.a1["S1-03"]-(6-st.a1["S1-15"]))>=3) inc.push(2);
  // top reasons: factors contributing most toward the verdict side
  const fac={}; const FN={"S1-01":"실습 중심 학습","S1-02":"이론 중심 학습","S1-03":"진로 분야","S1-04":"진로 탐색 경험","S1-05":"졸업 후 계획","S1-06":"자격증·기술","S1-07":"빠른 사회 진출","S1-08":"교과 공부","S1-09":"몸으로 하는 작업","S1-11":"분야 맞춤 진학","S1-12":"현장 경험"};
  S1.forEach(q=>{ if(!q.dir) return; const a=st.a1[q.id]; if(a==null) return;
    const s = q.type==="choice" ? (q.opts.find(x=>x[0]===a)||[0,0,0])[2]*q.dir*q.w : (a-3)*q.dir*q.w; fac[q.id]=s; });
  return {sum,max,idx,v,override,inc,fac,FN,info:["예","모르겠다"].includes(st.a1["S1-14"])};
}
function reasons1(r){
  const ids = Object.keys(r.fac).filter(k=> r.v==="일반고 권장" ? r.fac[k]<0 : r.fac[k]>0).sort((a,b)=>Math.abs(r.fac[b])-Math.abs(r.fac[a])).slice(0,3);
  const T = {
    "S1-01":"직접 만들고 실습하며 배우는 방식을 좋아해요","S1-02": r.fac["S1-02"]<0?"개념을 깊이 이해하는 공부를 즐겨요":"이론 공부보다는 다른 방식이 더 잘 맞아요",
    "S1-03":"배우고 싶은 분야가 이미 정해져 있어요","S1-04":"하고 싶은 일을 스스로 알아본 적이 있어요",
    "S1-05": r.fac["S1-05"]<0?"4년제 대학 직행을 원해요":"졸업 후 취업이나 일과 병행하는 진학을 생각하고 있어요",
    "S1-06":"자격증과 기술을 일찍 갖고 싶어 해요","S1-07":"빨리 사회에 나가 내 일을 하고 싶어 해요",
    "S1-08": r.fac["S1-08"]<0?"국·영·수 공부를 계속 이어가는 것도 괜찮다고 했어요":"국·영·수 중심 공부를 3년 더 하는 건 부담스러워해요",
    "S1-09":"몸을 움직이며 작업할 때 집중이 잘 돼요","S1-11":"좋아하는 분야에 맞춰 학교를 고르고 싶어 해요","S1-12":"학교 밖 현장 경험을 원해요"};
  // when verdict is 일반고, reverse-meaning phrasing for positive-direction items with low answers
  const TN = {"S1-01":"실습보다 다른 학습 방식이 더 편해요","S1-03":"배우고 싶은 분야가 아직 정해지지 않았어요","S1-06":"자격증·기술을 서둘러 갖는 데 큰 관심은 없어요","S1-07":"사회 진출을 서두르고 싶진 않아요","S1-09":"앉아서 집중하는 공부도 잘 맞아요","S1-11":"분야보다 다른 기준으로 학교를 고르고 싶어 해요","S1-12":"현장 경험에 큰 관심은 없어요","S1-04":"진로를 아직 많이 알아보지 않았어요"};
  return ids.map(k=> (r.fac[k]<0 && TN[k]) ? TN[k] : T[k]);
}

/* ---------- 2단계 matching ---------- */
function profile(){
  const h = RIA.map(t=>{ const v=[1,2,3].map(k=>st.ah[`S2-H${t}${k}`]).filter(x=>x!=null); return v.length?(v.reduce((a,b)=>a+b,0)/v.length-1)/4:0.5; });
  const c = CAPS.map(k=> (st.ac[k]??0)/3);
  const cnt = a=>PAIRS.reduce((n,q,i)=>n+(q.ax===a&&st.ap[i]==="b"?1:0),0);
  const obj = {사람:0,사물:0,데이터:0,아이디어:0};
  PAIRS.forEach((q,i)=>{ if(q.ax!=="obj"||!st.ap[i]) return; obj[(st.ap[i]==="a"?q.a:q.b)[0]]++; });
  const s = [cnt("field")/2, cnt("team")/2, obj.사람/3, obj.사물/3, obj.데이터/3, obj.아이디어/3];
  return {h,c,s,fav:st.fav.slice()};
}
function pearson(x,y){
  const n=x.length, mx=x.reduce((a,b)=>a+b,0)/n, my=y.reduce((a,b)=>a+b,0)/n;
  let sxy=0,sx=0,sy=0; for(let i=0;i<n;i++){ const a=x[i]-mx,b=y[i]-my; sxy+=a*b; sx+=a*a; sy+=b*b; }
  return (sx===0||sy===0)?0:sxy/Math.sqrt(sx*sy);
}
function scoreGroup(g,p){
  const fw=[1,.7,.5]; let fi=0, fcode="";
  p.fav.forEach((c,k)=>{ if(g.codes.includes(c) && fw[k]>fi){ fi=fw[k]; fcode=c; } });
  const hob=(pearson(p.h,g.h)+1)/2;
  const sw=g.c.reduce((a,b)=>a+b,0); const cap = sw? g.c.reduce((a,w,i)=>a+w*p.c[i],0)/sw : 0;
  const sty = 1 - g.s.reduce((a,v,i)=>a+Math.abs(v-p.s[i]),0)/6;
  const B=CFG.base, bs=B.h+B.c+B.s;
  const rest = (hob*B.h+cap*B.c+sty*B.s)/bs;
  const noFav = p.fav.length===0;
  const tot = noFav ? rest : fi*CFG.W + rest*(1-CFG.W);
  const k = noFav?1:(1-CFG.W);
  const contrib = {f: noFav?0:fi*CFG.W, h:hob*B.h/bs*k, c:cap*B.c/bs*k, s:sty*B.s/bs*k};
  return {g, total:Math.round(tot*1000)/10, fi, fcode, hob, cap, sty, contrib};
}
function reasons2(r,p){
  const out=[]; const order=Object.entries(r.contrib).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  for (const k of order){
    if (out.length>=2) break;
    if (k==="f" && r.fi>0) out.push(`관심 있다고 고른 ‘${codeName(r.fcode)}’ 분야예요`);
    if (k==="h" && r.hob>=0.6){ let best=0,bi=0; RIA.forEach((t,i)=>{ const v=p.h[i]*r.g.h[i]; if(v>best){best=v;bi=i;} }); out.push(`‘${RIA_LABEL[RIA[bi]]}’ 활동을 좋아하는 흥미와 잘 맞아요`); }
    if (k==="c" && r.cap>=0.4){ let best=0,bi=0; CAPS.forEach((t,i)=>{ const v=p.c[i]*r.g.c[i]; if(v>best){best=v;bi=i;} }); if(best>0) out.push(`‘${CAP_LABEL[CAPS[bi]]}’ 실력을 살릴 수 있어요`); }
    if (k==="s" && r.sty>=0.7) out.push(`실내·현장, 혼자·함께 같은 일하는 방식이 비슷해요`);
  }
  if (!out.length) out.push("여러 영역이 고르게 맞아요");
  return out;
}
function homeLabel(){ const h=st.home; if(!h) return ""; return h.src==="gps"?"현재 위치를 기준으로 거리를 계산해요. 학교에서 진단 중이라면 학교 위치가 잡혔을 수 있어요.":`${h.label} 중심을 기준으로 대략 계산해요.`; }
function schoolOK(s){
  const c=st.cond;
  if (s.type==="마이스터고" && !c.meister) return false;
  return (s.gender==="공학"&&c.coed)||(s.gender==="여"&&c.female)||(s.gender==="남"&&c.male);
}
function deptsFor(gid,gs){
  const sm = Object.fromEntries(DATA.schools.map(s=>[s.name,s]));
  const gsc = Object.fromEntries(gs.map(r=>[r.g.id,r.total]));
  return DATA.depts.filter(d=>(d.g===gid||d.sub===gid) && sm[d.school] && schoolOK(sm[d.school]))
    .map(d=>({...d, sc: d.sub ? gsc[d.g]*CFG.mainW + gsc[d.sub]*CFG.subW : gsc[d.g], s:sm[d.school], isMain:d.g===gid}))
    .map(d=>({...d, dist: distOf(d.s)}))
    .sort((a,b)=> (st.sort==="near" && a.dist && b.dist) ? (a.dist.km-b.dist.km) || (b.sc-a.sc)
                                                      : (b.isMain-a.isMain) || (b.sc-a.sc) || (b.quota-a.quota));
}
function pickDistinct(list,n){
  const seen=new Set(), out=[];
  for (const d of list){ if(!seen.has(d.school)){ seen.add(d.school); out.push(d); if(out.length===n) break; } }
  return out;
}
function stationHTML(d){
  const g=d.s.gender==="공학"?"남녀공학":(d.s.gender==="여"?"여학교":"남학교");
  const bits=[d.isMain?null:"관련 학과", d.s.type==="마이스터고"?"마이스터고":null, g, `정원 ${d.quota}명`, d.common?"1학년 공통모집 후 2학년에 학과 배정":null, d.s.dorm==="있음"?"기숙사 있음":null].filter(Boolean);
  if (d.dist) bits.unshift(d.dist.sameGu ? "같은 구" : `${d.dist.approx?"약 ":"직선 "}${d.dist.km.toFixed(1)}km`);
  const nm = d.school.replace(/고등학교$/,"고");
  return `<div class="sta"><div><span class="nm">${esc(nm)}</span> <span class="dp">${esc(d.dept)}</span></div>
    <div class="inf">${esc(bits.join(", "))}${d.s.url?` <a class="noprint" href="${esc(d.s.url)}" target="_blank" rel="noopener">학교 누리집</a>`:""}</div></div>`;
}
function careerHTML(g){
  const c=g.career||{now:[],more:[],univ:[]}; if(!c.now.length&&!c.more.length) return "";
  const tags=(a,cls)=>a.map(t=>`<span class="tag ${cls}">${esc(t)}</span>`).join("");
  return `<section class="career" aria-label="졸업 후 진로"><h4>졸업 후 갈 수 있는 길</h4><dl>
    ${c.now.length?`<dt>바로 취업</dt><dd>${tags(c.now,"now")}</dd>`:""}
    ${c.more.length?`<dt>더 배우면</dt><dd>${tags(c.more,"")}</dd>`:""}
    ${c.univ.length?`<dt>대학 학과</dt><dd class="plain">${esc(c.univ.join(", "))}</dd>`:""}
  </dl></section>`;
}
