<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026학년도 학사일정</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: #eef2ff; color: #1e293b; min-height: 100vh; }
.page-wrap { max-width: 1240px; margin: 0 auto; padding: 28px 16px 48px; }

.page-header {
  text-align: center; padding: 18px 24px 16px;
  background: linear-gradient(135deg, #3b5bdb 0%, #e64980 100%);
  border-radius: 24px; color: white; margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(59,91,219,.28); position: relative; overflow: hidden;
}
.page-header::before {
  content:''; position:absolute; inset:0;
  background: radial-gradient(ellipse at 20% 50%, rgba(255,255,255,.12) 0%, transparent 60%);
}
.page-title { font-size: 2.3rem; font-weight: 900; letter-spacing: 3px; margin-bottom: 6px; position: relative; }
.page-notice { font-size: .8rem; opacity: .85; font-weight: 400; position: relative; }

.legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 28px; }
.legend-item {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 16px; background: white; border-radius: 20px;
  font-size: .83rem; font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.07);
}
.ldot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

.sem-wrap { margin-top: 32px; margin-bottom: 18px; display: flex; align-items: center; gap: 16px; }
.sem-badge {
  padding: 9px 22px; border-radius: 12px; font-weight: 900; font-size: 1.05rem;
  color: white; letter-spacing: 1px; white-space: nowrap; flex-shrink: 0;
}
.badge-s1 { background: linear-gradient(135deg,#3b5bdb,#4c6ef5); box-shadow:0 4px 14px rgba(59,91,219,.35); }
.badge-s2 { background: linear-gradient(135deg,#e64980,#f06595); box-shadow:0 4px 14px rgba(230,73,128,.35); }
.sem-line  { flex:1; height:2px; border-radius:2px; }
.line-s1   { background: linear-gradient(to right,#4c6ef5,transparent); }
.line-s2   { background: linear-gradient(to right,#f06595,transparent); }

.months-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
@media(max-width:900px){ .months-grid{ grid-template-columns:repeat(2,1fr); gap:14px; } }
@media(max-width:600px){ .months-grid{ grid-template-columns:1fr; gap:12px; } .page-title{ font-size:1.3rem; letter-spacing:1px; } }

.month-card {
  background: white; border-radius: 18px;
  box-shadow: 0 3px 20px rgba(0,0,0,.08); border: 1px solid rgba(0,0,0,.04);
  overflow: visible;   /* span 바가 인접 셀로 흘러나올 수 있도록 */
}
.month-head {
  padding: 12px 16px; color: white; font-weight: 700; font-size: .98rem;
  display: flex; justify-content: space-between; align-items: center;
  border-radius: 17px 17px 0 0; overflow: hidden;
}
.month-head.s1  { background: linear-gradient(135deg,#3b5bdb,#4c6ef5); }
.month-head.s2  { background: linear-gradient(135deg,#e64980,#f06595); }
.month-head.vac { background: linear-gradient(135deg,#64748b,#94a3b8); }
.month-head.mx1 { background: linear-gradient(135deg,#3b5bdb,#7c8fdc); }
.month-head.mx2 { background: linear-gradient(135deg,#64748b,#e64980); }
.month-head.mx3 { background: linear-gradient(135deg,#e64980,#64748b); }
.sem-tag {
  font-size: .68rem; padding: 2px 9px;
  background: rgba(255,255,255,.25); border-radius: 20px; font-weight: 500;
}

.cal-body {
  padding: 8px 8px 6px;
  overflow: visible;
  border-radius: 0 0 17px 17px;
}

/* 요일 헤더 */
.wday-row {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  margin-bottom: 4px;
}
.wday { text-align:left; font-size:.7rem; font-weight:700; color:#94a3b8; padding:3px 4px; }
.wday:first-child { color:#ef4444; }
.wday:last-child  { color:#3b82f6; }

/* 날짜 그리드 */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 0;
}

/*
  날짜 셀
  ─ position: relative 제거 → span 바(z-index:5)가
    인접 셀 배경 위에 그려질 수 있도록
*/
.cal-cell {
  min-height: 72px;
  padding: 0;
  min-width: 0;
  overflow: visible;
  border-right:  1px solid #e0e7f0;
  border-bottom: 1px solid #e0e7f0;
  background: white;
  vertical-align: top;
}
.cal-cell:nth-child(7n) { border-right: 1px solid #e0e7f0; }  /* nth-child 오적용 방지 */
.cal-cell.sat { border-right: none; }
.cal-cell.on-vac { background: #f8faff; }

.dnum {
  padding: 3px 4px 2px;
  font-size: .78rem; font-weight: 700; line-height: 1.3; color: #334155;
}
.cal-cell.sun .dnum { color: #ef4444; }
.cal-cell.sat .dnum { color: #3b82f6; }
.cal-cell.hol .dnum { color: #ef4444; }

/*
  span 래퍼: 상대 위치 기준점. 높이는 텍스트 라벨이 결정.
*/
.span-wrap {
  display: block;
  position: relative;
  margin: 0 2px 1px 0;
  min-height: 17px;
}

/*
  배경 바: 절대 위치로 N칸 폭만큼 뻗음. 텍스트와 독립.
  z-index:4 → 인접 셀 배경 위, 텍스트 아래
*/
.span-bg {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  border-radius: 3px;
  z-index: 4;
}

/*
  텍스트 라벨: absolute로 배경 바 위에 겹침
  width는 JS에서 span-bg와 동일하게 인라인 지정
*/
.span-label {
  position: absolute;
  top: 0; left: 0;
  z-index: 5;
  display: block;
  padding: 1px 4px;
  font-size: .57rem;
  font-weight: 600;
  line-height: 1.4;
  color: white;
  white-space: normal;
  word-break: keep-all;
  overflow-wrap: break-word;
}

/* 중간·끝 셀 스페이서 */
.span-spacer {
  display: block;
  height: 17px;
  margin-bottom: 1px;
}

/* 단일 이벤트 */
.evt {
  display: block;
  font-size: .57rem;
  line-height: 1.55;
  padding: 1px 3px;
  border-radius: 3px;
  margin: 0 2px 1px;
  white-space: normal;
  word-break: keep-all;
  overflow-wrap: break-word;
  overflow: visible;
  color: white;
  font-weight: 600;
}
.evt.holiday  { background: #ef4444; }
.evt.exam     { background: #f97316; }
.evt.activity { background: #0ea5e9; }
.evt.event    { background: #8b5cf6; }
.evt.health   { background: #10b981; }

.vac-mark { font-size:.55rem; color:#c8d5e8; font-weight:500; text-align:center; padding: 3px 0; }

@media print {
  body { background: white; }
  .page-wrap { padding: 8px; max-width: none; }
  .months-grid { grid-template-columns: repeat(3,1fr) !important; gap: 10px; }
  .page-header { padding: 18px; }
  .page-title  { font-size: 1.5rem; }
  .month-card  { break-inside: avoid; }
}
@media(max-width:600px){
  .page-wrap { padding: 12px 8px 32px; }
  .page-header { padding: 24px 16px; border-radius: 16px; }
  .cal-cell { min-height: 80px; }
  .dnum { font-size: .85rem; padding: 4px 5px 2px; }
  .evt { font-size: .65rem; line-height: 1.6; padding: 2px 4px; margin: 0 2px 2px; }
  .span-bar { font-size: .65rem; height: 20px; line-height: 20px; }
  .span-spacer { height: 20px; }
  .wday { font-size: .75rem; padding: 4px 5px; }
  .month-head { padding: 14px 16px; font-size: 1.05rem; }
  .sem-tag { font-size: .72rem; }
}
</style>
</head>
<body>
<div class="page-wrap">

  <div class="page-header">
    <div class="page-title">2026학년도 혜원여중 학사일정</div>
    <div class="page-notice">※ 학교 사정에 따라 일정이 변경될 수 있습니다.</div>
  </div>



  <div id="cal-root"></div>

</div>
<script>
/* ── 색상 맵 ── */
const COLORS = {
  holiday: '#ef4444', exam: '#f97316',
  activity: '#0ea5e9', event: '#8b5cf6', health: '#10b981'
};

/* ══════════════════════════════════════════
   다일 이벤트 정의
   days: 시작일 → 종료일 순서
══════════════════════════════════════════ */
const SPANS = [
  {label:'수련활동 및 소규모테마교육여행 ②③', c:'activity', days:['2026-4-1','2026-4-2','2026-4-3']},
  {label:'체험활동 ①',                       c:'activity', days:['2026-4-1','2026-4-2','2026-4-3']},
  {label:'중간고사 ②③',   c:'exam',     days:['2026-4-28','2026-4-29']},
  {label:'직업체험 ①',    c:'activity', days:['2026-4-28','2026-4-29']},
  {label:'기말고사 ②③',   c:'exam',     days:['2026-6-30','2026-7-1','2026-7-2']},
  {label:'추석연휴',       c:'holiday',  days:['2026-9-24','2026-9-25','2026-9-26']},
  {label:'기말고사 ③',    c:'exam',     days:['2026-10-19','2026-10-20','2026-10-21']},
  {label:'중간고사 ①②',   c:'exam',     days:['2026-10-19','2026-10-20']},
  {label:'기말고사 ①②',   c:'exam',     days:['2026-12-7','2026-12-8','2026-12-9']},
];

/*
  SPAN_MAP: 날짜 키 → [{label, c, pos, remainingDays, spanId}]
  remainingDays: 이 날짜부터 span 종료까지 남은 일수(자신 포함)
  pos: 'start' | 'mid' | 'end'
*/
const SPAN_MAP = {};
SPANS.forEach((sp, si) => {
  const n = sp.days.length;
  sp.days.forEach((day, i) => {
    if(!SPAN_MAP[day]) SPAN_MAP[day] = [];
    SPAN_MAP[day].push({
      label: sp.label,
      c: sp.c,
      pos: i===0 ? 'start' : i===n-1 ? 'end' : 'mid',
      remainingDays: n - i,
      spanId: `sp${si}`
    });
  });
});

/* ── 단일 이벤트 ── */
const EV = {
  '2026-3-1':  [{t:'삼일절',c:'holiday'}],
  '2026-3-2':  [{t:'대체공휴일',c:'holiday'}],
  '2026-3-3':  [{t:'입학식 ①',c:'event'},{t:'시업식 ②③',c:'event'}],
  '2026-3-4':  [{t:'동아리 홍보',c:'activity'}],
  '2026-3-5':  [{t:'개교기념일(휴업)',c:'holiday'}],
  '2026-3-12': [{t:'창체의날',c:'activity'}],
  '2026-3-13': [{t:'학부모총회',c:'event'},{t:'학교공개의날',c:'event'},{t:'상담주간 시작',c:'event'}],
  '2026-3-25': [{t:'학업성취도평가',c:'exam'}],
  '2026-3-26': [{t:'동아리',c:'activity'}],
  '2026-3-27': [{t:'학생건강검진',c:'health'}],

  '2026-4-6':  [{t:'1기 방과후 시작',c:'event'}],
  '2026-4-16': [{t:'동아리',c:'activity'}],



  '2026-5-4':  [{t:'재량휴업일',c:'holiday'}],
  '2026-5-5':  [{t:'어린이날',c:'holiday'}],
  '2026-5-14': [{t:'동아리',c:'activity'}],
  '2026-5-15': [{t:'스승의날',c:'event'}],
  '2026-5-21': [{t:'앨범촬영 ③',c:'event'}],
  '2026-5-24': [{t:'부처님오신날',c:'holiday'}],
  '2026-5-25': [{t:'대체공휴일',c:'holiday'}],
  '2026-5-27': [{t:'대의원총회',c:'event'}],

  '2026-6-1':  [{t:'고사시간표 발표',c:'exam'}],
  '2026-6-3':  [{t:'지방선거일',c:'holiday'}],
  '2026-6-6':  [{t:'현충일',c:'holiday'}],
  '2026-6-10': [{t:'영어듣기평가',c:'exam'}],
  '2026-6-11': [{t:'동아리',c:'activity'}],
  '2026-6-22': [{t:'1학기 수행평가 마감',c:'exam'}],


  '2026-7-7':  [{t:'생명존중교육',c:'activity'}],
  '2026-7-10': [{t:'학생회 워크숍',c:'event'}],
  '2026-7-14': [{t:'창체의날',c:'activity'}],
  '2026-7-16': [{t:'동아리',c:'activity'}],
  '2026-7-17': [{t:'제헌절',c:'holiday'}],
  '2026-7-21': [{t:'🌞 여름방학식',c:'event'}],

  '2026-8-15': [{t:'광복절',c:'holiday'}],
  '2026-8-17': [{t:'대체공휴일',c:'holiday'}],
  '2026-8-18': [{t:'🍂 2학기 개학식',c:'event'}],
  '2026-8-19': [{t:'학급임원선출',c:'event'}],
  '2026-8-27': [{t:'동아리',c:'activity'}],

  '2026-9-1':  [{t:'학교공개의날',c:'event'},{t:'소변검사',c:'health'}],
  '2026-9-2':  [{t:'학급체험활동',c:'activity'}],
  '2026-9-7':  [{t:'3기 방과후 시작',c:'event'}],
  '2026-9-10': [{t:'동아리',c:'activity'}],
  '2026-9-17': [{t:'진로박람회 ③',c:'activity'}],
  '2026-9-21': [{t:'고사시간표 발표',c:'exam'}],

  '2026-10-3': [{t:'개천절',c:'holiday'}],
  '2026-10-5': [{t:'대체공휴일',c:'holiday'}],
  '2026-10-8': [{t:'동아리',c:'activity'}],
  '2026-10-9': [{t:'한글날',c:'holiday'}],
  '2026-10-14':[{t:'영어듣기평가',c:'exam'}],
  '2026-10-15':[{t:'수행평가 마감 ③',c:'exam'}],


  '2026-11-4': [{t:'학생회장선거',c:'event'}],
  '2026-11-5': [{t:'동아리',c:'activity'}],
  '2026-11-9': [{t:'고사시간표 발표',c:'exam'}],
  '2026-11-18':[{t:'수능 예비소집',c:'event'}],
  '2026-11-19':[{t:'대학수학능력시험(휴업)',c:'holiday'}],
  '2026-11-20':[{t:'재량휴업일',c:'holiday'}],


  '2026-12-17':[{t:'동아리',c:'activity'}],
  '2026-12-18':[{t:'학생회 이취임식',c:'event'},{t:'동아리한마당',c:'activity'}],
  '2026-12-21':[{t:'진로활동',c:'activity'}],
  '2026-12-24':[{t:'혜원 체육의날',c:'event'}],
  '2026-12-25':[{t:'성탄절',c:'holiday'}],
  '2026-12-28':[{t:'진급·졸업 사정회',c:'event'}],
  '2026-12-31':[{t:'🌨️ 겨울방학식',c:'event'}],

  '2027-1-1':  [{t:'신정',c:'holiday'}],
  '2027-2-1':  [{t:'🌸 겨울개학식',c:'event'}],
  '2027-2-5':  [{t:'종업식 ①②',c:'event'},{t:'졸업식 ③',c:'event'}],
  '2027-2-7':  [{t:'설날',c:'holiday'}],
  '2027-2-9':  [{t:'대체공휴일',c:'holiday'}],
  '2027-2-18': [{t:'신입생 재배정발표',c:'event'}],
};

/* ── 공휴일 ── */
const HOLS = new Set([
  '2026-3-1','2026-3-2','2026-3-5',
  '2026-5-4','2026-5-5','2026-5-24','2026-5-25',
  '2026-6-3','2026-6-6','2026-7-17',
  '2026-8-15','2026-8-17',
  '2026-9-24','2026-9-25','2026-9-26',
  '2026-10-3','2026-10-5','2026-10-9',
  '2026-11-19','2026-11-20',
  '2026-12-25',
  '2027-1-1','2027-2-7','2027-2-9',
]);

function isVac(y,m,d){
  if(y===2026 && m===7 && d>=22) return true;
  if(y===2026 && m===8 && d<=17) return true;
  if(y===2027 && m===1)          return true;
  return false;
}
function daysIn(y,m)   { return new Date(y,m,0).getDate(); }
function startDow(y,m) { return new Date(y,m-1,1).getDay(); }

const MONTHS = [
  {y:2026,m:3,  n:'3월',  tag:'1학기', cls:'s1'},
  {y:2026,m:4,  n:'4월',  tag:'1학기', cls:'s1'},
  {y:2026,m:5,  n:'5월',  tag:'1학기', cls:'s1'},
  {y:2026,m:6,  n:'6월',  tag:'1학기', cls:'s1'},
  {y:2026,m:7,  n:'7월',  tag:'1학기', cls:'mx1'},
  {y:2026,m:8,  n:'8월',  tag:'2학기', cls:'mx2'},
  {y:2026,m:9,  n:'9월',  tag:'2학기', cls:'s2'},
  {y:2026,m:10, n:'10월', tag:'2학기', cls:'s2'},
  {y:2026,m:11, n:'11월', tag:'2학기', cls:'s2'},
  {y:2026,m:12, n:'12월', tag:'2학기', cls:'mx3'},
  {y:2027,m:1,  n:'1월',  tag:'2학기', cls:'vac'},
  {y:2027,m:2,  n:'2월',  tag:'2학기', cls:'s2'},
];

function renderMonth(cfg){
  const {y,m,n,tag,cls} = cfg;
  const total = daysIn(y,m), start = startDow(y,m);
  let cells = '';

  for(let i=0; i<start; i++)
    cells += `<div class="cal-cell"></div>`;

  for(let d=1; d<=total; d++){
    const key  = `${y}-${m}-${d}`;
    const dow  = (start + d - 1) % 7;
    const vac  = isVac(y,m,d);
    const hol  = HOLS.has(key);

    let cc = 'cal-cell';
    if(dow===0) cc += ' sun';
    if(dow===6) cc += ' sat';
    if(hol)     cc += ' hol';
    if(vac)     cc += ' on-vac';

    /* ── span 이벤트 처리 ── */
    const spans = SPAN_MAP[key] || [];
    let spanHtml = '';
    for(const se of spans){
      if(se.pos === 'start' || (d === 1 && (se.pos === 'mid' || se.pos === 'end'))){
        const daysToWeekEnd  = 7 - dow;
        const daysToMonthEnd = total - d + 1;
        const eff = Math.min(se.remainingDays, daysToWeekEnd, daysToMonthEnd);
        const bg  = COLORS[se.c];
        const sid = se.spanId;
        // 배경 바 width = eff칸, 텍스트 라벨은 첫 칸(100%) 안에서 줄바꿈
        spanHtml += `<span class="span-wrap" data-span-id="${sid}">` +
          `<span class="span-bg" style="width:calc(${eff}*100% + ${eff-1}px);background:${bg};"></span>` +
          `<span class="span-label" style="width:calc(${eff}*100% + ${eff-1}px);">${se.label}</span>` +
          `</span>`;
      } else {
        spanHtml += `<span class="span-spacer" data-span-id="${se.spanId}"></span>`;
      }
    }

    /* ── 단일 이벤트 ── */
    const singles = EV[key] || [];
    const singleHtml = singles.map(e =>
      `<span class="evt ${e.c}" title="${e.t}">${e.t}</span>`
    ).join('');

    const vacMark = (!spans.length && !singles.length && vac)
      ? `<div class="vac-mark">방학</div>` : '';

    cells += `<div class="${cc}"><div class="dnum">${d}</div>${spanHtml}${singleHtml}${vacMark}</div>`;
  }

  return `<div class="month-card">
    <div class="month-head ${cls}">
      <span>${y}년 ${n}</span>
      <span class="sem-tag">${tag}</span>
    </div>
    <div class="cal-body">
      <div class="wday-row">
        <div class="wday">일</div><div class="wday">월</div><div class="wday">화</div>
        <div class="wday">수</div><div class="wday">목</div><div class="wday">금</div><div class="wday">토</div>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
  </div>`;
}

document.getElementById('cal-root').innerHTML = `
  <div class="months-grid">
    ${MONTHS.map(renderMonth).join('')}
  </div>
`;

/* span-label이 absolute이므로 span-wrap 높이를 라벨 높이로 맞춤 */
function syncSpacers(){
  document.querySelectorAll('.span-wrap').forEach(wrap => {
    const label = wrap.querySelector('.span-label');
    const h = label ? label.offsetHeight : 17;
    wrap.style.height = h + 'px';
    const id = wrap.dataset.spanId;
    if(!id) return;
    document.querySelectorAll(`.span-spacer[data-span-id="${id}"]`).forEach(s => {
      s.style.height = h + 'px';
    });
  });
}
/* 폰트 로딩 후 실행 */
if(document.fonts) document.fonts.ready.then(syncSpacers);
else window.addEventListener('load', syncSpacers);
</script>
