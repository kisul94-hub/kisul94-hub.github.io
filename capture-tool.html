<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>정보/기술 교과 캡쳐 도구</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1f2633; --sub:#5d6778; --line:#dfe3ea;
  --pri:#2f6fed; --pri-ink:#fff; --good:#1a8f4c; --bad:#d23b3b; --warn:#c98a00;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#1f2a44;color:#fff}
header h1{margin:0;font-size:19px;font-weight:700}
#conn{margin-left:auto;font-size:13px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.15)}
#conn.good{background:#1a8f4c}#conn.bad{background:#d23b3b}#conn.warn{background:#c98a00}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:16px;margin:0 0 12px}
h2:not(:first-child){margin-top:20px}
label{display:block;margin-bottom:12px;font-weight:600;font-size:14px}
input[type=text],input:not([type]){display:block;width:100%;margin-top:5px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit}
input:focus{outline:2px solid var(--pri);border-color:transparent}
.fname{margin-top:6px;padding:10px;background:#f0f4ff;border-radius:8px;font-size:13px;color:var(--sub);word-break:break-all}
.fname b{color:var(--ink);font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font-family:inherit;font-size:14px;padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
button:hover:not(:disabled){background:#f3f5f9}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button.primary:hover:not(:disabled){background:#265fd0}
button.big{font-size:16px;padding:12px 28px;font-weight:700}
.hint{color:var(--sub);font-size:13px;margin:10px 0}
#stage{position:relative;min-height:320px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fafbfc;overflow:hidden}
#stage.drag{border-color:var(--pri);background:#eef3ff}
#video,#canvas{max-width:100%;max-height:62vh;display:block}
#canvas{cursor:crosshair;touch-action:none}
#empty{color:var(--sub);text-align:center;line-height:1.7;padding:20px}
#cropBar{margin-top:10px;font-size:13px;color:var(--sub)}
#cropBar span{margin-right:auto}
#need{font-size:13px;color:var(--sub);margin-top:8px}
.msg{margin-top:10px;font-size:14px;min-height:20px}
.msg.good{color:var(--good);font-weight:700}.msg.bad{color:var(--bad);font-weight:600}
#done{margin-top:12px;display:flex;gap:14px;align-items:center;padding:12px;border:1px solid #bfe3cc;background:#effaf3;border-radius:10px}
#done img{width:140px;max-height:100px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px}
#done .t{font-size:13px;color:var(--sub);line-height:1.6;word-break:break-all}
#done .t b{color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>정보/기술 교과 캡쳐 도구</h1>
  <span id="conn">연결 확인 중…</span>
</header>

<main>
  <section class="panel">
    <h2>1. 내 정보</h2>
    <label>학번 (4자리: 학년·반·번호)
      <input id="sid" inputmode="numeric" maxlength="4" placeholder="예: 1101" autocomplete="off">
    </label>
    <label>이름
      <input id="sname" maxlength="20" placeholder="예: 홍길동" autocomplete="off">
    </label>
    <label>작품명
      <input id="title" maxlength="40" placeholder="예: 로봇팔" autocomplete="off">
    </label>
    <label id="codeWrap" hidden>수업 코드
      <input id="code" maxlength="10" placeholder="칠판의 코드" autocomplete="off">
    </label>
    <div class="fname">저장될 파일명<br><b id="fname">-</b></div>
  </section>

  <section class="panel">
    <h2>2. 작품 화면 가져오기</h2>
    <div class="btns">
      <button id="btnShare" class="primary">🖥️ 틴커캐드 탭 선택</button>
      <button id="btnSnap" disabled>📸 지금 화면 캡처</button>
      <button id="btnStop" disabled>공유 중지</button>
      <button id="btnFile">📁 파일에서 고르기</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <p class="hint">또는 <b>Win + Shift + S</b>로 화면을 캡처한 뒤 이 페이지에서 <b>Ctrl + V</b>로 붙여 넣거나, 이미지 파일을 아래 칸에 끌어다 놓아도 됩니다.</p>

    <div id="stage">
      <video id="video" autoplay muted playsinline hidden></video>
      <canvas id="canvas" hidden></canvas>
      <div id="empty">여기에 작품 화면이 나타납니다.<br>[틴커캐드 탭 선택] → 틴커캐드 탭 고르기 → [공유]</div>
    </div>
    <div class="btns" id="cropBar" hidden>
      <span id="cropInfo">마우스로 드래그하면 작품 부분만 잘라 낼 수 있습니다.</span>
      <button id="btnResetCrop">자르기 취소</button>
      <button id="btnRetake">다시 캡처</button>
    </div>

    <h2>3. 제출</h2>
    <button id="btnSubmit" class="primary big" disabled>제출하기</button>
    <div id="need"></div>
    <div id="msg" class="msg"></div>
    <div id="done" hidden>
      <img id="doneImg" alt="제출한 작품">
      <div class="t">
        <b>제출 완료</b><br>
        파일명: <span id="doneName"></span><br>
        시각: <span id="doneTime"></span><br>
        <button id="btnNext" style="margin-top:6px">다른 작품 제출하기</button>
      </div>
    </div>
  </section>
</main>

<script>
/* ===== 설정 ===== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbypetRtth0m7v9au7-l2H0yJ6Y2mrxQ3pPYXsXjyr_MMh4IqzvVkMidN99gBT4EsrWN/exec',  // Apps Script 웹앱 주소
  MAX_WIDTH: 0,                // 0 = 줄이지 않고 원본 픽셀 크기 그대로 저장
  MAX_BYTES: 9.5 * 1024 * 1024 // 서버 한도(10MB)를 넘을 때만 JPEG로 압축(크기는 그대로)
};
const API = new URLSearchParams(location.search).get('api') || CONFIG.API_URL;

/* ===== 공통 ===== */
const $ = id => document.getElementById(id);
const src = document.createElement('canvas');   // 캡처 원본(자르기 전)
const cv = $('canvas');
let hasImage = false, stream = null, crop = null, dragStart = null;
let needCode = false, busy = false, lastUrl = null;

function clean(s, max = 40) {
  return String(s || '').replace(/[\\/:*?"<>|#%\u0000-\u001f]/g, '').replace(/\s+/g, ' ').trim().slice(0, max);
}
function store(k, v) { try { localStorage.setItem('capTool_' + k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem('capTool_' + k) || ''; } catch (e) { return ''; } }
function msg(type, text) { $('msg').className = 'msg ' + (type || ''); $('msg').textContent = text || ''; }
function setConn(type, text) { $('conn').className = type; $('conn').textContent = text; }

/* ===== 입력 ===== */
$('sid').value = load('sid');
$('sname').value = load('sname');
$('sid').addEventListener('input', () => {
  $('sid').value = $('sid').value.replace(/\D/g, '').slice(0, 4);
  store('sid', $('sid').value); refresh();
});
$('sname').addEventListener('input', () => { store('sname', $('sname').value); refresh(); });
$('title').addEventListener('input', refresh);
$('code').addEventListener('input', refresh);

function problems() {
  const p = [];
  if (!/^\d{4}$/.test($('sid').value)) p.push('학번 4자리');
  if (!clean($('sname').value, 20)) p.push('이름');
  if (!clean($('title').value)) p.push('작품명');
  if (needCode && !$('code').value.trim()) p.push('수업 코드');
  if (!hasImage) p.push('작품 화면 캡처');
  return p;
}
function refresh() {
  const sid = $('sid').value || '학번';
  const n = clean($('sname').value, 20) || '이름';
  const t = clean($('title').value) || '작품명';
  $('fname').textContent = `${sid}_${n}_${t}.png`;
  const p = problems();
  $('btnSubmit').disabled = busy || p.length > 0 || !API;
  $('need').textContent = !API ? '업로드 주소가 설정되지 않았습니다. 선생님께 알려 주세요.'
    : (p.length ? '남은 항목: ' + p.join(', ') : '제출할 준비가 되었습니다.');
}

/* ===== 서버 연결 확인 ===== */
async function checkServer() {
  if (!API) { setConn('bad', '업로드 주소 미설정'); refresh(); return; }
  try {
    const r = await fetch(API);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '');
    needCode = !!j.needCode;
    $('codeWrap').hidden = !needCode;
    setConn(j.open ? 'good' : 'warn', j.open ? '제출 가능' : '제출 마감');
  } catch (e) {
    setConn('bad', '서버 연결 실패');
  }
  refresh();
}

/* ===== 화면 보이기 전환 ===== */
function showEmpty() {
  $('video').hidden = true; cv.hidden = true; $('empty').hidden = false; $('cropBar').hidden = true;
}
function showLive() {
  $('video').hidden = false; cv.hidden = true; $('empty').hidden = true; $('cropBar').hidden = true;
  $('btnSnap').disabled = false; $('btnStop').disabled = false;
}
function setImage() {
  hasImage = true; crop = null;
  $('video').hidden = true; $('empty').hidden = true; cv.hidden = false; $('cropBar').hidden = false;
  $('done').hidden = true;
  draw(); refresh();
  msg('', '필요하면 드래그해서 작품 부분만 잘라 낸 뒤 [제출하기]를 누르세요.');
}
function clearImage() {
  hasImage = false; crop = null;
  if (stream) showLive(); else showEmpty();
  refresh();
}

/* ===== 탭 공유 캡처 ===== */
if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
  $('btnShare').disabled = true;
  $('btnShare').title = '이 브라우저(또는 http 주소)에서는 화면 선택을 쓸 수 없습니다.';
}
$('btnShare').onclick = async () => {
  try {
    stopShare();
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: 'browser', frameRate: 15 },
      audio: false,
      selfBrowserSurface: 'exclude',
      preferCurrentTab: false
    });
    const v = $('video');
    v.srcObject = stream;
    await v.play().catch(() => {});
    stream.getVideoTracks()[0].addEventListener('ended', stopShare);
    hasImage = false; crop = null;
    showLive(); refresh();
    msg('', '틴커캐드에서 작품 각도를 맞춘 뒤 이 탭으로 돌아와 [지금 화면 캡처]를 누르세요.');
  } catch (e) {
    if (e.name !== 'NotAllowedError') msg('bad', '화면을 가져오지 못했습니다: ' + e.message);
  }
};
$('btnSnap').onclick = () => {
  const v = $('video');
  if (!v.videoWidth) { msg('bad', '아직 화면이 준비되지 않았습니다. 잠시 후 다시 눌러 주세요.'); return; }
  src.width = v.videoWidth; src.height = v.videoHeight;
  src.getContext('2d').drawImage(v, 0, 0);
  setImage();
};
function stopShare() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('video').srcObject = null;
  $('btnSnap').disabled = true; $('btnStop').disabled = true;
  if (!hasImage) showEmpty();
}
$('btnStop').onclick = stopShare;
$('btnRetake').onclick = () => {
  clearImage();
  if (!stream) msg('', '[틴커캐드 탭 선택]을 다시 누르거나, 새 캡처를 붙여 넣으세요.');
  else msg('', '각도를 다시 맞춘 뒤 [지금 화면 캡처]를 누르세요.');
};

/* ===== 붙여넣기 / 끌어다 놓기 / 파일 ===== */
async function loadBlob(b) {
  if (!b || !b.type.startsWith('image/')) { msg('bad', '이미지 파일만 넣을 수 있습니다.'); return; }
  try {
    const bmp = await createImageBitmap(b);
    src.width = bmp.width; src.height = bmp.height;
    src.getContext('2d').drawImage(bmp, 0, 0);
    if (bmp.close) bmp.close();
    setImage();
  } catch (e) { msg('bad', '이미지를 읽지 못했습니다.'); }
}
document.addEventListener('paste', e => {
  const items = Array.from((e.clipboardData && e.clipboardData.items) || []);
  const it = items.find(i => i.type.startsWith('image/'));
  if (!it) return;
  e.preventDefault();
  loadBlob(it.getAsFile());
});
['dragenter', 'dragover'].forEach(t => window.addEventListener(t, e => { e.preventDefault(); $('stage').classList.add('drag'); }));
['dragleave', 'drop'].forEach(t => window.addEventListener(t, e => { e.preventDefault(); $('stage').classList.remove('drag'); }));
window.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadBlob(f); });
$('btnFile').onclick = () => $('file').click();
$('file').onchange = () => { const f = $('file').files[0]; if (f) loadBlob(f); $('file').value = ''; };

/* ===== 자르기 ===== */
function draw() {
  const ctx = cv.getContext('2d');
  cv.width = src.width; cv.height = src.height;
  ctx.drawImage(src, 0, 0);
  if (crop) {
    const s = cv.width / (cv.getBoundingClientRect().width || cv.width);
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath();
    ctx.rect(0, 0, cv.width, cv.height);
    ctx.rect(crop.x, crop.y, crop.w, crop.h);
    ctx.fill('evenodd');
    ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 2 * s; ctx.setLineDash([8 * s, 5 * s]);
    ctx.strokeRect(crop.x, crop.y, crop.w, crop.h);
    ctx.restore();
    $('cropInfo').textContent = `자를 영역: ${Math.round(crop.w)} × ${Math.round(crop.h)} 픽셀`;
  } else {
    $('cropInfo').textContent = '마우스로 드래그하면 작품 부분만 잘라 낼 수 있습니다.';
  }
}
function pt(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(cv.width, (e.clientX - r.left) * cv.width / r.width)),
    y: Math.max(0, Math.min(cv.height, (e.clientY - r.top) * cv.height / r.height))
  };
}
cv.addEventListener('pointerdown', e => { if (!hasImage) return; dragStart = pt(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!dragStart) return;
  const p = pt(e);
  crop = { x: Math.min(p.x, dragStart.x), y: Math.min(p.y, dragStart.y), w: Math.abs(p.x - dragStart.x), h: Math.abs(p.y - dragStart.y) };
  draw();
});
cv.addEventListener('pointerup', () => {
  if (!dragStart) return;
  dragStart = null;
  if (crop && (crop.w < 20 || crop.h < 20)) crop = null;
  draw();
});
$('btnResetCrop').onclick = () => { crop = null; draw(); };

/* ===== 이미지 만들기 ===== */
function toBlobP(c, type, q) { return new Promise(r => c.toBlob(r, type, q)); }
async function exportImage() {
  // 화면에 작게 보여도 좌표는 원본 픽셀 기준. 정수로 맞춰 번짐 없이 그대로 잘라 냄
  const c = crop || { x: 0, y: 0, w: src.width, h: src.height };
  const x = Math.round(c.x), y = Math.round(c.y);
  const r = { x, y, w: Math.min(src.width - x, Math.round(c.w)), h: Math.min(src.height - y, Math.round(c.h)) };
  const k = CONFIG.MAX_WIDTH ? Math.min(1, CONFIG.MAX_WIDTH / r.w) : 1;
  const out = document.createElement('canvas');
  out.width = Math.round(r.w * k); out.height = Math.round(r.h * k);
  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = k < 1;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, r.x, r.y, r.w, r.h, 0, 0, out.width, out.height);
  let blob = await toBlobP(out, 'image/png'), mime = 'image/png';
  if (blob.size > CONFIG.MAX_BYTES) {
    ctx.globalCompositeOperation = 'destination-over';
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, out.width, out.height);
    for (const q of [0.95, 0.9, 0.8, 0.65]) {
      blob = await toBlobP(out, 'image/jpeg', q); mime = 'image/jpeg';
      if (blob.size <= CONFIG.MAX_BYTES) break;
    }
  }
  return { blob, mime };
}
function toBase64(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1]);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

/* ===== 제출 ===== */
$('btnSubmit').onclick = async () => {
  if (busy || problems().length || !API) return;
  busy = true; refresh();
  $('btnSubmit').textContent = '올리는 중…';
  msg('', '작품을 올리고 있습니다. 창을 닫지 마세요.');
  try {
    const { blob, mime } = await exportImage();
    const payload = {
      sid: $('sid').value,
      name: clean($('sname').value, 20),
      title: clean($('title').value),
      code: $('code').value.trim(),
      mime,
      data: await toBase64(blob)
    };
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '알 수 없는 오류');
    showDone(blob, j);
    msg('good', '제출 완료! 선생님 드라이브에 저장되었습니다.');
  } catch (e) {
    msg('bad', '제출 실패: ' + e.message + ' (다시 시도해 보세요)');
  } finally {
    busy = false;
    $('btnSubmit').textContent = '제출하기';
    refresh();
  }
};
function showDone(blob, j) {
  if (lastUrl) URL.revokeObjectURL(lastUrl);
  lastUrl = URL.createObjectURL(blob);
  $('doneImg').src = lastUrl;
  $('doneName').textContent = j.fileName;
  $('doneTime').textContent = new Date().toLocaleString('ko-KR');
  $('done').hidden = false;
}
$('btnNext').onclick = () => {
  $('title').value = '';
  $('done').hidden = true;
  clearImage(); msg('', '');
  $('title').focus();
};

/* ===== 시작 ===== */
refresh();
checkServer();
</script>
</body>
</html>
